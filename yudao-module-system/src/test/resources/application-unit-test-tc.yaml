spring:
  main:
    lazy-initialization: true # 开启懒加载，加快速度
    banner-mode: off # 单元测试，禁用 Banner

--- #################### 数据库相关配置 ####################

spring:
  # 数据源配置项
  # 注意：url / username / password / driver-class-name 不在这里写，
  # 由 BaseDbTestcontainersTest 的 @DynamicPropertySource 在运行时注入（容器端口是随机映射的，写死不了）
  datasource:
    name: ruoyi-vue-pro
    druid:
      async-init: true # 单元测试，异步初始化 Druid 连接池，提升启动速度
      initial-size: 1 # 单元测试，配置为 1，提升启动速度
  sql:
    init:
      # 关键点：MySQL 不是嵌入式数据库，mode 必须显式设为 always，否则 Spring Boot 默认只给嵌入式库（H2）执行建表脚本，真 MySQL 上会直接跳过、然后报表不存在
      mode: always
      # 使用 MySQL 方言版建表脚本（现有 create_tables.sql 是 H2 方言，含 GENERATED BY DEFAULT AS IDENTITY 等 MySQL 不支持的语法，不能直接复用）
      schema-locations: classpath:/sql/create_tables_mysql.sql

  # Redis 配置。本基类不装配 Redis，仅为与 application-unit-test.yaml 保持结构一致而保留
  data:
    redis:
      host: 127.0.0.1 # 地址
      port: 16379 # 端口（单元测试，使用 16379 端口）
      database: 0 # 数据库索引

mybatis:
  lazy-initialization: true # 单元测试，设置 MyBatis Mapper 延迟加载，加速每个单元测试

--- #################### 芋道相关配置 ####################

# 芋道配置项，设置当前项目所有自定义的配置
yudao:
  info:
    base-package: cn.iocoder.yudao.module
